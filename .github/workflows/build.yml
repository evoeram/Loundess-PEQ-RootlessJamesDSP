name: Build app and Magisk module
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - v*
  workflow_dispatch:
    inputs:
      moduleVersion:
        description: 'Magisk module version, e.g. v6.3.7-peq-loudness (optional)'
        required: false
      moduleVersionCode:
        description: 'Magisk module versionCode, e.g. 111 (optional)'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app (${{ matrix.flavor }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        flavor: [Rootless, Root]

    steps:
      - id: flavor
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ matrix.flavor }}

      - name: Clone repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Declare build type
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
          else
            echo "BUILD_TYPE=preview" >> $GITHUB_ENV
          fi

      - name: Gradle build (release on tags, preview otherwise)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ./gradlew assemble${{ matrix.flavor }}FullRelease
          else
            ./gradlew assemble${{ matrix.flavor }}FullPreview
          fi

      - name: Sign APKs
        # Release builds are already debug-signed by Gradle, so this step is
        # only needed when real signing secrets are configured
        if: ${{ secrets.SIGNING_KEYSTORE != '' }}
        uses: ilharp/sign-android-release@v2
        with:
          buildToolsVersion: 35.0.0
          releaseDir: app/build/outputs/apk/${{ steps.flavor.outputs.lowercase }}Full/${{ env.BUILD_TYPE }}
          signingKey: ${{ secrets.SIGNING_KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename build artifacts
        run: |
          set -e
          DIR=app/build/outputs/apk/${{ steps.flavor.outputs.lowercase }}Full/${{ env.BUILD_TYPE }}
          ls -l $DIR
          # Signed by the action: strip the -unsigned-signed suffix
          for f in $DIR/*-unsigned-signed.apk; do
            [ -e "$f" ] && mv -v "$f" "${f/-unsigned-signed/}" || true
          done
          rm -f $DIR/*unsigned*.apk || true
          ls -l $DIR

      - name: Upload build artifact (universal)
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.flavor }}-universal-apk"
          path: app/build/outputs/apk/${{ steps.flavor.outputs.lowercase }}Full/${{ env.BUILD_TYPE }}/*universal-*.apk
          if-no-files-found: error

      - name: Upload build artifact (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.flavor }}-arm64-v8a-apk"
          path: app/build/outputs/apk/${{ steps.flavor.outputs.lowercase }}Full/${{ env.BUILD_TYPE }}/*arm64-v8a-*.apk
          if-no-files-found: error

      - name: Upload build artifact (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.flavor }}-armeabi-v7a-apk"
          path: app/build/outputs/apk/${{ steps.flavor.outputs.lowercase }}Full/${{ env.BUILD_TYPE }}/*armeabi-v7a-*.apk
          if-no-files-found: error

      - name: Upload build artifact (x86)
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.flavor }}-x86-apk"
          path: app/build/outputs/apk/${{ steps.flavor.outputs.lowercase }}Full/${{ env.BUILD_TYPE }}/*x86-*.apk
          if-no-files-found: error

      - name: Upload build artifact (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.flavor }}-x86_64-apk"
          path: app/build/outputs/apk/${{ steps.flavor.outputs.lowercase }}Full/${{ env.BUILD_TYPE }}/*x86_64-*.apk
          if-no-files-found: error

      - name: Deploy root flavor APKs to the server
        if: ${{ steps.flavor.outputs.lowercase == 'root' && startsWith(github.ref, 'refs/tags/') && github.repository == 'timschneeb/RootlessJamesDSP' }}
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
            username: 'tim'
            server: 'srv1.timschneeberger.me'
            ssh_private_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
            local_path: "app/build/outputs/apk/${{ steps.flavor.outputs.lowercase }}Full/${{ env.BUILD_TYPE }}/*universal-${{ env.BUILD_TYPE }}-signed.apk"
            remote_path: '/srv/http/nightly.timschneeberger.me/jamesdsp-rootfull'
            sftpArgs: '-o ConnectTimeout=5'

  module:
    name: Build Magisk module
    runs-on: ubuntu-latest
    needs: build
    # Manual dispatch (with version inputs) or module release tags (vX.Y.Z-peq-loudness)
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, 'peq-loudness')) }}
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Download root universal APK
        uses: actions/download-artifact@v4
        with:
          name: Root-universal-apk
          path: apk

      - name: Resolve module version
        run: |
          set -e
          if [[ -n "${{ github.event.inputs.moduleVersion }}" ]]; then
            VERSION="${{ github.event.inputs.moduleVersion }}"
            CODE="${{ github.event.inputs.moduleVersionCode }}"
          else
            VERSION="${GITHUB_REF_NAME}"
            # v6.3.7 -> 6*10000 + 3*100 + 7 = 60307
            BASE="${VERSION#v}"; BASE="${BASE%%-*}"
            CODE=$(( $(echo "$BASE" | cut -d. -f1) * 10000 + $(echo "$BASE" | cut -d. -f2) * 100 + $(echo "$BASE" | cut -d. -f3) ))
          fi
          [[ -n "$VERSION" && -n "$CODE" ]] || { echo "module version/code not set" >&2; exit 1; }
          echo "MODULE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "MODULE_VERSION_CODE=$CODE" >> $GITHUB_ENV

      - name: Build module zip
        run: |
          chmod +x magisk-module/build-module.sh
          ./magisk-module/build-module.sh \
            -v "$MODULE_VERSION" -c "$MODULE_VERSION_CODE" \
            -a "$(find apk -name '*universal-*.apk' | head -1)"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: magisk-module
          path: |
            magisk-module/ainur_jamesdsp-peq-loudness-*.zip
            magisk-module/build/update.json
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build, module]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-apk"
          path: dist
          merge-multiple: true

      - name: Download module artifact
        if: ${{ needs.module.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: magisk-module
          path: dist

      - name: Changelog
        uses: ardalanamini/auto-changelog@v3
        id: changelog
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-name: ${{ github.ref_name }}
          mention-authors: false
          mention-new-contributors: false
          include-compare: true

      - name: Read changelog template
        id: changelog_post
        uses: andstor/file-reader-action@v1
        with:
          path: ".github/CHANGELOG_POSTFIX.md"
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "${{ steps.changelog.outputs.changelog }} &#x20; ${{ steps.changelog_post.outputs.contents }}"
          files: |
            dist/*.apk
            dist/*.zip
            dist/update.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
